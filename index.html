<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Achievement</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
            margin: 0;
        }

        .card {
            background: white;
            max-width: 800px;
            margin: auto;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        h1 {
            color: #0078d4;
        }

        p {
            color: #666;
        }

        select {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            margin: 20px 0;
            font-size: 16px;
            border-radius: 6px;
        }

        button {
            background: #107C10;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
            font-size: 16px;
        }

        button:hover {
            background: #0b5f0b;
        }

        .linkedin {
            display: inline-block;
            background: #0077B5;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin: 10px;
            font-size: 16px;
        }

        .linkedin:hover {
            background: #005f91;
        }

        #preview {
            margin-top: 25px;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 8px;
            text-align: left;
            min-height: 80px;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>🎉 Share Your Achievement</h1>

    <p>Select the Learning Path you completed:</p>

    <select id="learningPath" onchange="updateMessage()">
        <option value="">Select a Learning Path</option>
        <option value="Microsoft Copilot Learning Path">Microsoft Copilot Learning Path</option>
        <option value="Power Platform Fundamentals">Power Platform Fundamentals</option>
        <option value="Azure Fundamentals">Azure Fundamentals</option>
        <option value="Cyber Security Awareness">Cyber Security Awareness</option>
        <option value="Data & AI Essentials">Data & AI Essentials</option>
    </select>

    <div id="preview">
        Select a Learning Path to generate your LinkedIn post.
    </div>

    <br>

    <button onclick="copyMessage()">
        📋 Copy LinkedIn Message
    </button>

    https://www.linkedin.com/feed/"
       target="_blank"
       rel="noopener noreferrer"
       class="linkedin">
       🔗 Open LinkedIn
    </a>

</div>

<script>

let linkedinMessage = "";

function updateMessage() {

    const learningPath = document.getElementById("learningPath").value;

    if (!learningPath) {

        linkedinMessage = "";

        document.getElementById("preview").innerHTML =
            "Select a Learning Path to generate your LinkedIn post.";

        return;
    }

    linkedinMessage =
        "🎉 I'm pleased to share that I have successfully completed the " +
        learningPath +
        ". I continue to invest in developing my professional skills and knowledge.";

    document.getElementById("preview").innerText = linkedinMessage;
}

function copyMessage() {

    if (!linkedinMessage) {
        alert("Please select a Learning Path first.");
        return;
    }

    navigator.clipboard.writeText(linkedinMessage)
        .then(() => {
            alert("LinkedIn message copied to clipboard!");
        })
        .catch(() => {
            alert("Unable to copy message.");
        });
}

</script>

</body>
</html>
