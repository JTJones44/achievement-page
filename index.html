<!DOCTYPE html>
<html>
<head>
    <title>Learning Path Achievement Share</title>

    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .card {
            background: white;
            max-width: 800px;
            margin: auto;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.1);
        }

        h1 {
            color: #0078d4;
        }

        select {
            width: 100%;
            max-width: 500px;
            padding: 12px;
            margin: 20px 0;
            font-size: 16px;
        }

        button {
            background: #107C10;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
        }

        .linkedin {
            display: inline-block;
            background: #0077B5;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin: 10px;
        }

        #preview {
            margin-top: 25px;
            padding: 20px;
            background: #f8f8f8;
            border-radius: 8px;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>🎉 Share Your Achievement</h1>

    <p>Select the Learning Path you completed:</p>

    <select id="learningPath" onchange="updateMessage()">
        <option value="">Select a Learning Path</option>
        <option>Microsoft Copilot Learning Path</option>
        <option>Power Platform Fundamentals</option>
        <option>Azure Fundamentals</option>
        <option>Cyber Security Awareness</option>
        <option>Data & AI Essentials</option>
    </select>

    <div id="preview">
        Select a Learning Path to generate your LinkedIn post.
    </div>

    <button onclick="copyMessage()">
        📋 Copy LinkedIn Message
    </button>

    <a href="https://www.linkedin.com/feed/"
 LinkedIn
</a>

</div>

<script>

let linkedinMessage = "";

function updateMessage() {

    const learningPath =
        document.getElementById("learningPath").value;

    if (!learningPath) {

        document.getElementById("preview").innerHTML =
            "Select a Learning Path to generate your LinkedIn post.";

        return;
    }

    linkedinMessage =
        `🎉 I'm pleased to share that I have successfully completed the ${learningPath}. I continue to invest in developing my professional skills and knowledge.`;

    document.getElementById("preview").innerHTML =
        linkedinMessage;
}

function copyMessage() {

    if (!linkedinMessage) {
        alert("Please select a Learning Path first.");
        return;
    }

    navigator.clipboard.writeText(linkedinMessage);

    alert("LinkedIn message copied to clipboard!");
}

</script>

</body>
</html>
