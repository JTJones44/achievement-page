<!DOCTYPE html>
<html>
<head>
    <title>Achievement Share</title>
</head>

<body>

    <h1>🎉 Congratulations!</h1>

    <h2 id="curriculum"></h2>

    <script>

        const params = new URLSearchParams(window.location.search);

        const curriculum =
            params.get("curriculum") ||
            "Microsoft Copilot Learning Path";

        document.getElementById("curriculum").innerText =
            curriculum;

    </script>

</body>
</html>
